<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шумилов Андрей Сергеевич</title>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Приглушенная палитра */
        :root {
            --bg-color: #1a1a1a;
            --text-main: #d4d4d4;
            --text-muted: #888888;
            --accent: #a3a3a3;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 24px;
            max-width: 400px;
            width: 100%;
        }

        /* Анимация появления */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpAnim 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.4s; }

        @keyframes fadeUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Аватарка */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            transition: border-color 0.3s ease, transform 0.3s ease;
        }

        .avatar:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        /* Заголовок */
        h1 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        /* Кнопки-ссылки */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            text-decoration: none;
            color: var(--text-muted);
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Иконка телеграма */
        .btn svg {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 8px;
            fill: currentColor;
            margin-top: -2px;
        }

        /* Футер */
        .footer {
            font-size: 0.75rem;
            color: #555555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1 class="fade-up delay-2">Шумилов Андрей Сергеевич</h1>
